plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mdb.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.mdb.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // Emulador Android: 10.0.2.2 aponta para o "localhost" da máquina host.
        buildConfigField "String", "JAVA_API_BASE_URL", '"http://10.0.2.2:8080"'
        buildConfigField "String", "PYTHON_API_BASE_URL", '"http://10.0.2.2:8000"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
