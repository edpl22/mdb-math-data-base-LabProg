<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Problemas | MDB</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" defer></script>
</head>
<body>
<header id="app-header" class="site-header"></header>

<main class="container page">
    <div class="page-title-row">
        <div>
            <h1 class="mb-0">Problemas</h1>
            <p class="text-secondary mb-0">Busca e filtros combináveis</p>
        </div>
        <button class="btn btn-secondary" id="random-filtered-btn" type="button" title="Sorteia um problema que respeite os filtros atuais">
            Sortear com estes filtros
        </button>
    </div>

    <div class="catalog-layout">
        <aside class="filters-sidebar" id="filters-sidebar">
            <button class="filters-toggle" id="filters-toggle" type="button" aria-expanded="false">
                <span>Filtros</span><span id="filters-toggle-icon">+</span>
            </button>
            <div class="filters-sidebar-inner">
                <div class="filter-group">
                    <label class="filter-group-title" for="f-text">Texto</label>
                    <input type="search" id="f-text" placeholder="Título ou enunciado..." />
                    <div class="hint-text">Pressione Enter para buscar.</div>
                </div>

                <div class="filter-group">
                    <div class="filter-group-title">Área</div>
                    <div id="filter-area-options"></div>
                </div>

                <div class="filter-group">
                    <div class="filter-group-title">Dificuldade</div>
                    <div class="form-group">
                        <span class="hint-text">Mínima</span>
                        <div class="difficulty-select" id="filter-min-difficulty"></div>
                    </div>
                    <div class="form-group" style="margin-top: var(--space-3); margin-bottom: 0;">
                        <span class="hint-text">Máxima</span>
                        <div class="difficulty-select" id="filter-max-difficulty"></div>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-group-title" for="filter-topic-search">Tópicos</label>
                    <input type="search" id="filter-topic-search" placeholder="Buscar tópico..." />
                    <div id="filter-topic-options" class="mt-3"></div>
                </div>

                <button class="filter-clear" id="clear-filters" type="button">Limpar todos os filtros</button>
            </div>
        </aside>

        <div class="catalog-main">
            <div class="results-bar">
                <div id="results-info" class="label-mono"></div>
                <div id="active-filters" class="active-filters"></div>
            </div>
            <div id="problem-list-container">
                <div class="loading-row"><span class="spinner"></span><span>Carregando problemas…</span></div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
</main>

<footer class="site-footer" id="app-footer"></footer>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/integration.js"></script>
<script>window.MDB_ACTIVE_PAGE = 'catalog';</script>
<script src="/js/catalog.js"></script>
</body>
</html>
