spring:
  application:
    name: mdb-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mdb}
    username: ${DB_USER:mdb}
    password: ${DB_PASSWORD:mdb}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

mdb:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-key-change-me-please-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:8081,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.mdb.backend: INFO
