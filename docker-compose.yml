services:
  postgres:
    image: postgres:16-alpine
    container_name: mdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mdb}
      POSTGRES_USER: ${DB_USER:-mdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mdb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mdb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mdb} -d ${DB_NAME:-mdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-java:
    build:
      context: ./backend-java
    container_name: mdb-backend-java
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-mdb}
      DB_USER: ${DB_USER:-mdb}
      DB_PASSWORD: ${DB_PASSWORD:-mdb}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-key-change-me-please-1234567890}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5500,http://localhost:3000}
      SERVER_PORT: 8080
    ports:
      - "${JAVA_PORT:-8080}:8080"

  backend-python:
    build:
      context: ./backend-python
    container_name: mdb-backend-python
    restart: unless-stopped
    depends_on:
      - backend-java
    environment:
      MDB_JAVA_API_BASE_URL: http://backend-java:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5500,http://localhost:3000}
    ports:
      - "${PYTHON_PORT:-8000}:8000"

  frontend-web:
    image: nginx:alpine
    container_name: mdb-frontend-web
    restart: unless-stopped
    depends_on:
      - backend-java
      - backend-python
    volumes:
      - ./frontend-web:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  mdb_postgres_data:
