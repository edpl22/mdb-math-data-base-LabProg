<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta — MDB</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header id="app-header" class="site-header"></header>

<main class="container page">
    <div class="form-panel">
        <div class="flex-between">
            <h1 class="mb-0">Criar conta</h1>

        </div>
        <p class="hint-text">Crie sua conta para salvar favoritos e acompanhar seus exercícios.</p>
        <div id="form-alert"></div>
        <form id="register-form">
            <div class="form-group">
                <label class="field-label" for="name">Nome</label>
                <input type="text" id="name" autocomplete="name" maxlength="150" required />
            </div>
            <div class="form-group">
                <label class="field-label" for="email">Email</label>
                <input type="email" id="email" autocomplete="email" maxlength="180" required />
            </div>
            <div class="form-group">
                <label class="field-label" for="password">Senha</label>
                <input type="password" id="password" autocomplete="new-password" minlength="6" maxlength="100" required />
                <div class="hint-text">Mínimo de 6 caracteres.</div>
            </div>
            <button class="btn btn-block" type="submit">Criar conta</button>
        </form>
        <p class="mt-5 text-center">Já tem conta? <a href="/pages/login.html">Entrar</a></p>
    </div>
</main>

<footer class="site-footer" id="app-footer"></footer>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/integration.js"></script>
<script>window.MDB_ACTIVE_PAGE = '';</script>
<script src="/js/auth.js"></script>
</body>
</html>
