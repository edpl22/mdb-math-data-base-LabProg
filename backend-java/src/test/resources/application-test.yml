spring:
  datasource:
    url: jdbc:h2:mem:mdb_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

mdb:
  jwt:
    secret: test-only-secret-key-not-for-production-use-0000000000
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5500
